<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Agent - نظام الشؤون القانونية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .sidebar {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideRight 0.6s ease;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h2::before {
            content: "🔍";
            font-size: 1.5em;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-tabs button {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: #666;
        }

        .search-tabs button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-tabs button:hover {
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideLeft 0.6s ease;
        }

        .content h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-card:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .result-card p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .result-card .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state::before {
            content: "📭";
            display: block;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .detail-view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .detail-view.active {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .detail-header h3 {
            color: #667eea;
            font-size: 1.5em;
        }

        .close-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            background: #ff5252;
        }

        .detail-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .detail-content h4 {
            color: #667eea;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .detail-content p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            background: #e0e0e0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status-badge.active {
            background: #4caf50;
            color: white;
        }

        .status-badge.pending {
            background: #ff9800;
            color: white;
        }

        .status-badge.draft {
            background: #2196f3;
            color: white;
        }

        .status-badge.closed {
            background: #f44336;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }

            .results {
                grid-template-columns: 1fr;
            }

            .search-tabs {
                flex-direction: column;
            }

            .search-tabs button {
                flex: none;
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Legal Agent</h1>
            <p>نظام إدارة الشؤون القانونية - Legal Management System</p>
        </header>

        <div class="main-grid">
            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <h2>البحث</h2>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ابحث...">
                </div>

                <div class="search-tabs">
                    <button class="active" data-type="cases">📋 القضايا</button>
                    <button data-type="contracts">📄 العقود</button>
                    <button data-type="documents">📑 الوثائق</button>
                </div>

                <div id="stats" class="stats">
                    <div class="loading">جاري التحميل...</div>
                </div>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="content">
                <h2 id="contentTitle">📊 الملخص العام</h2>

                <div id="loader" class="loader">
                    <div class="spinner"></div>
                </div>

                <!-- عرض النتائج -->
                <div id="resultsView">
                    <div id="results" class="results"></div>
                </div>

                <!-- عرض التفاصيل -->
                <div id="detailView" class="detail-view">
                    <div class="detail-header">
                        <h3 id="detailTitle"></h3>
                        <button class="close-btn" onclick="closeDetail()">إغلاق</button>
                    </div>
                    <div id="detailContent" class="detail-content"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentSearchType = 'cases';
        let currentSummary = null;

        // عناصر DOM
        const searchInput = document.getElementById('searchInput');
        const searchTabs = document.querySelectorAll('.search-tabs button');
        const resultsView = document.getElementById('results');
        const detailView = document.getElementById('detailView');
        const contentTitle = document.getElementById('contentTitle');
        const loader = document.getElementById('loader');
        const statsDiv = document.getElementById('stats');

        // تحميل الملخص عند بدء الصفحة
        window.addEventListener('load', () => {
            loadSummary();
        });

        // معالجات الأحداث
        searchInput.addEventListener('input', (e) => {
            if (e.target.value.length > 0) {
                performSearch();
            } else {
                displaySummary();
            }
        });

        searchTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                searchTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentSearchType = tab.dataset.type;

                if (searchInput.value.length > 0) {
                    performSearch();
                } else {
                    displaySummary();
                }
            });
        });

        // دالة تحميل الملخص
        async function loadSummary() {
            try {
                const response = await fetch('/api/summary');
                currentSummary = await response.json();
                displaySummary();
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        // دالة عرض الملخص
        function displaySummary() {
            if (!currentSummary) return;

            contentTitle.textContent = '📊 الملخص العام';
            resultsView.innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h3 style="color: #667eea; margin-bottom: 30px;">احصائيات النظام</h3>
                    <div class="stats" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); max-width: 800px; margin: 0 auto;">
                        <div class="stat-card">
                            <div class="number">${currentSummary.total_cases}</div>
                            <div class="label">إجمالي القضايا</div>
                        </div>
                        <div class="stat-card">
                            <div class="number">${currentSummary.active_cases}</div>
                            <div class="label">القضايا النشطة</div>
                        </div>
                        <div class="stat-card">
                            <div class="number">${currentSummary.total_contracts}</div>
                            <div class="label">إجمالي العقود</div>
                        </div>
                        <div class="stat-card">
                            <div class="number">${currentSummary.total_documents}</div>
                            <div class="label">إجمالي الوثائق</div>
                        </div>
                    </div>
                </div>
            `;

            updateStats();
        }

        // دالة البحث
        async function performSearch() {
            const query = searchInput.value;
            if (!query) return;

            showLoader();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: currentSearchType,
                        query: query
                    })
                });

                const data = await response.json();
                hideLoader();
                displayResults(data.results, data.count);
            } catch (error) {
                hideLoader();
                console.error('Error searching:', error);
                resultsView.innerHTML = '<div class="empty-state">حدث خطأ في البحث</div>';
            }
        }

        // دالة عرض النتائج
        function displayResults(results, count) {
            const typeLabels = {
                'cases': '📋 القضايا',
                'contracts': '📄 العقود',
                'documents': '📑 الوثائق'
            };

            contentTitle.textContent = `${typeLabels[currentSearchType]} (${count})`;

            if (results.length === 0) {
                resultsView.innerHTML = '<div class="empty-state">لا توجد نتائج</div>';
                return;
            }

            resultsView.innerHTML = results.map(item => `
                <div class="result-card" onclick="showDetail('${currentSearchType}', '${item.id}')">
                    <h3>${item.title}</h3>
                    <p>${item.description || item.type || 'لا توجد وصف'}</p>
                    <div>
                        <span class="badge">${item.status || item.type || 'معلومة'}</span>
                        ${item.priority ? `<span class="badge">${item.priority}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // دالة عرض التفاصيل
        async function showDetail(type, id) {
            if (type === 'cases') {
                try {
                    const response = await fetch(`/api/case/${id}`);
                    const caseData = await response.json();

                    let detailHTML = `
                        <h4>المعلومات الأساسية</h4>
                        <p><strong>المعرف:</strong> ${caseData.id}</p>
                        <p><strong>الحالة:</strong> <span class="status-badge ${caseData.status}">${caseData.status}</span></p>
                        <p><strong>الأولوية:</strong> ${caseData.priority || 'غير محددة'}</p>
                        <p><strong>الأطراف:</strong> ${(caseData.parties || []).join(', ')}</p>
                        <p><strong>الوصف:</strong> ${caseData.description || 'لا يوجد وصف'}</p>
                        <p><strong>الملاحظات:</strong> ${caseData.notes || 'لا توجد ملاحظات'}</p>
                    `;

                    if (caseData.related_documents && caseData.related_documents.length > 0) {
                        detailHTML += `
                            <h4>الوثائق المرتبطة</h4>
                            <ul style="margin-right: 20px;">
                                ${caseData.related_documents.map(doc => `<li>${doc.title} (${doc.type})</li>`).join('')}
                            </ul>
                        `;
                    }

                    document.getElementById('detailTitle').textContent = caseData.title;
                    document.getElementById('detailContent').innerHTML = detailHTML;
                    detailView.classList.add('active');
                } catch (error) {
                    console.error('Error loading details:', error);
                }
            }
        }

        // دالة إغلاق التفاصيل
        function closeDetail() {
            detailView.classList.remove('active');
        }

        // دوال العرض/الإخفاء
        function showLoader() {
            loader.classList.add('active');
        }

        function hideLoader() {
            loader.classList.remove('active');
        }

        // تحديث الإحصائيات
        function updateStats() {
            if (!currentSummary) return;

            const stats = [
                { label: 'القضايا النشطة', value: currentSummary.active_cases },
                { label: 'العقود المسودات', value: currentSummary.draft_contracts || 0 },
                { label: 'إجمالي الوثائق', value: currentSummary.total_documents }
            ];

            statsDiv.innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="number">${stat.value}</div>
                    <div class="label">${stat.label}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
