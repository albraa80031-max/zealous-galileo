name: Legal Agent - Sync & Test

on:
  push:
    branches: [ master, claude/* ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 */6 * * *'  # كل 6 ساعات

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 legal_agent tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Format check with black
      run: |
        black --check legal_agent tests

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=legal_agent --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  sync:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Sync data with GitHub
      run: |
        python -m legal_agent.sync_runner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit and push synchronized data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync legal data [skip ci]" && git push)

  check-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint black isort

    - name: Check code style
      run: |
        isort --check-only legal_agent tests
        black --line-length 100 --check legal_agent tests
        pylint legal_agent --disable=missing-docstring --exit-zero
